<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 68" width="100%" height="100%" role="presentation">
  <defs>
    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E7C47" stop-opacity="0" />
      <stop offset="25%" stop-color="#3E7C47" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#C88A36" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#3E7C47" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3E7C47" stop-opacity="0" />
    </linearGradient>

    <g id="konpeitoStar">
      <polygon points="0,-6.5 2,-2 6.5,-2 3,1 4.5,6 0,3 -4.5,6 -3,1 -6.5,-2 -2,-2" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" fill-opacity="0.45" />
    </g>

    <g id="miniSoot">
      <circle cx="0" cy="0" r="11" fill="#1B1B1E" />
      <path d="M-13,0 L-9,-2 M13,0 L9,2 M0,-13 L-2,-9 M0,13 L2,9 M-9,-9 L-6,-6 M9,-9 L6,-6 M-9,9 L-6,6 M9,9 L6,6" stroke="#1B1B1E" stroke-width="2" stroke-linecap="round" />
      <circle cx="-3.6" cy="-1.2" r="3.4" fill="#FFFFFF" />
      <circle cx="3.6" cy="-1.2" r="3.4" fill="#FFFFFF" />
      <circle cx="-3.2" cy="-1.2" r="1.5" fill="#111111" />
      <circle cx="4.0" cy="-1.2" r="1.5" fill="#111111" />
    </g>
  </defs>

  <style>
    .hop-a { animation: hopSprite 2.1s ease-in-out infinite; }
    .hop-b { animation: hopSprite 2.4s ease-in-out 0.35s infinite; }
    .hop-c { animation: hopSprite 2.0s ease-in-out 0.7s infinite; }
    @keyframes hopSprite {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .candy-spin-1 {
      animation: candyPulse 3s ease-in-out infinite alternate;
    }
    .candy-spin-2 {
      animation: candyPulse 3.6s ease-in-out 0.8s infinite alternate;
    }
    @keyframes candyPulse {
      0% { transform: translateY(2px) scale(0.92); }
      100% { transform: translateY(-4px) scale(1.08); }
    }
  </style>

  <!-- Botanical Vine Line -->
  <path d="M60,36 Q320,28 500,36 M700,36 Q880,44 1140,36" stroke="url(#vineGrad)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Small Leaves Along the Vine -->
  <g fill="#4E8752" opacity="0.75">
    <path d="M260,33 Q266,24 274,31 Q266,36 260,33 Z" />
    <path d="M360,34 Q366,42 374,35 Q366,30 360,34 Z" />
    <path d="M445,35 Q451,26 459,33 Q451,38 445,35 Z" />
    <path d="M745,37 Q751,28 759,35 Q751,40 745,37 Z" />
    <path d="M830,38 Q836,46 844,39 Q836,34 830,38 Z" />
    <path d="M930,37 Q936,28 944,35 Q936,40 930,37 Z" />
  </g>

  <!-- Center Parade of Susuwatari & Konpeito Candies -->
  <g class="candy-spin-1" transform="translate(522, 36)">
    <use href="#konpeitoStar" fill="#FF7EB6" />
  </g>

  <g transform="translate(556, 36)">
    <g class="hop-a">
      <use href="#miniSoot" />
    </g>
  </g>

  <g class="candy-spin-2" transform="translate(580, 22)">
    <use href="#konpeitoStar" fill="#FFD166" />
  </g>

  <g transform="translate(600, 34) scale(1.12)">
    <g class="hop-b">
      <use href="#miniSoot" />
    </g>
  </g>

  <g class="candy-spin-1" transform="translate(622, 22)">
    <use href="#konpeitoStar" fill="#56E39F" />
  </g>

  <g transform="translate(644, 36)">
    <g class="hop-c">
      <use href="#miniSoot" />
    </g>
  </g>

  <g class="candy-spin-2" transform="translate(678, 36)">
    <use href="#konpeitoStar" fill="#72DDF7" />
  </g>
</svg>
