<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 185" width="100%" height="100%" role="img" aria-label="Ship it, then make it fast - but never ship what you wouldn't review.">
  <defs>
    <linearGradient id="footerSkyDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091020" />
      <stop offset="55%" stop-color="#132340" />
      <stop offset="100%" stop-color="#1E3C58" />
    </linearGradient>

    <linearGradient id="footerNightHill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1924" />
      <stop offset="50%" stop-color="#122B36" />
      <stop offset="100%" stop-color="#08131C" />
    </linearGradient>

    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE66D" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FF9F1C" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF9F1C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .quote-text {
      font-family: 'Georgia', 'Palatino Linotype', serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 700;
      fill: #F8F5E6;
    }
    .sub-sign {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #64DFDF;
      letter-spacing: 2px;
    }
    .ember-1 { animation: riseEmber 4.5s ease-in-out infinite; }
    .ember-2 { animation: riseEmber 5.5s ease-in-out 1.4s infinite; }
    .ember-3 { animation: riseEmber 4.0s ease-in-out 2.5s infinite; }
    @keyframes riseEmber {
      0% { transform: translateY(0px) scale(1); opacity: 0.95; }
      100% { transform: translateY(-42px) scale(0.45); opacity: 0; }
    }
  </style>

  <!-- Starlit Twilight Frame -->
  <rect width="1200" height="185" rx="18" fill="url(#footerSkyDark)" stroke="#233B5E" stroke-width="1.2" />

  <!-- Quote & Signature -->
  <text x="600" y="54" text-anchor="middle" class="quote-text">“Ship it, then make it fast — but never ship what you wouldn’t review.”</text>
  <text x="600" y="82" text-anchor="middle" class="sub-sign">✦ CRAFTED WITH GHIBLI SPIRIT · DHAKA, BANGLADESH ✦</text>

  <!-- Enchanted Twilight Ridges -->
  <path d="M0,132 Q240,94 520,128 Q840,156 1200,104 L1200,185 L0,185 Z" fill="#13293D" />
  <path d="M0,148 Q340,122 660,146 Q960,168 1200,130 L1200,185 L0,185 Z" fill="url(#footerNightHill)" />

  <!-- Rising Spirit Embers & Lantern Glows -->
  <g class="ember-1" transform="translate(260, 132)">
    <circle cx="0" cy="0" r="10" fill="url(#emberGlow)" />
    <circle cx="0" cy="0" r="2.8" fill="#FFE66D" />
  </g>
  <g class="ember-2" transform="translate(600, 140)">
    <circle cx="0" cy="0" r="12" fill="url(#emberGlow)" />
    <circle cx="0" cy="0" r="3" fill="#64DFDF" />
  </g>
  <g class="ember-3" transform="translate(940, 128)">
    <circle cx="0" cy="0" r="10" fill="url(#emberGlow)" />
    <circle cx="0" cy="0" r="2.8" fill="#FFE66D" />
  </g>
</svg>
