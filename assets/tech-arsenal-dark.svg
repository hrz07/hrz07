<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Tech Arsenal - Languages, Frontend, State, Styling, Backend, and AI Tooling">
  <defs>
    <!-- Night Workshop Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091020" />
      <stop offset="50%" stop-color="#0F1B33" />
      <stop offset="100%" stop-color="#0A1426" />
    </linearGradient>

    <!-- Midnight Card Surface -->
    <linearGradient id="cardDarkSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13223A" />
      <stop offset="100%" stop-color="#0E192D" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="darkSoftShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#02050B" flood-opacity="0.55" />
    </filter>
  </defs>

  <style>
    .card-title {
      font-family: 'Georgia', 'Palatino Linotype', serif;
      font-size: 18px;
      font-weight: 700;
      fill: #F8F5E6;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #FFE66D;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12.5px;
      font-weight: 600;
      fill: #D9E8F5;
    }
    .pill-text-accent {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12.5px;
      font-weight: 700;
      fill: #08121E;
    }

    /* Micro-animations */
    .float-icon {
      animation: bobIcon 3.4s ease-in-out infinite alternate;
    }
    .spin-slow {
      animation: rotateDial 16s linear infinite;
      transform-origin: 454px 56px;
    }
    .calcifer-flame {
      animation: flickerFlame 1.8s ease-in-out infinite alternate;
      transform-origin: 454px 262px;
    }
    .soot-bob {
      animation: bobIcon 2.2s ease-in-out infinite;
    }
    @keyframes bobIcon {
      0% { transform: translateY(-3px); }
      100% { transform: translateY(3px); }
    }
    @keyframes rotateDial {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes flickerFlame {
      0% { transform: scale(0.94) rotate(-3deg); }
      100% { transform: scale(1.08) rotate(3deg); }
    }
  </style>

  <!-- Outer Canvas Frame -->
  <rect width="1200" height="420" rx="18" fill="url(#bgDark)" stroke="#233B5E" stroke-width="1.5" />

  <!-- Subtle Spirit Corner Filigree -->
  <path d="M18,18 Q40,18 52,32 M18,18 Q18,40 32,52" stroke="#64DFDF" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M1182,18 Q1160,18 1148,32 M1182,18 Q1182,40 1168,52" stroke="#64DFDF" stroke-width="2" fill="none" opacity="0.4" />

